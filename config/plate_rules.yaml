# config/plate_rules.yaml

ocr:
  min_confidence: 0.25

layout:
  row_threshold_ratio: 0.65
  min_chars_for_two_rows: 5

format:
  output_separator_between_rows: ""
  remove_unknown_chars: true

rules:
  # Bien so nhom dac biet/ngoai giao/nuoc ngoai/chuyen dung co seri 2 chu cai
  # nhu 89CD-002.13, 80NN-123.45, 80LD-123.45.
  # Dat truoc rule xe dan dung de tach 5 so cuoi thanh 3 so + dau cham + 2 so.
  - name: "vn_special_1_line_2_letters_5_digits"
    type: "regex"
    pattern: "^([0-9]{2})(CD|LD|NN|NG|QT|CV)([0-9]{3})([0-9]{2})$"
    output: "{1}{2}-{3}.{4}"

  - name: "vn_car_1_line_8_chars"
    type: "regex"
    pattern: "^([0-9]{2})([A-Z]{1,2})([0-9]{4,5})$"
    output: "{1}{2}-{3}"

  - name: "vn_car_2_line"
    type: "two_rows"
    top_pattern: "^([0-9]{2})([A-Z]{1,2})$"
    bottom_pattern: "^([0-9]{4,5})$"
    output: "{top}-{bottom}"

  - name: "vn_motorbike_2_line"
    type: "two_rows"
    top_pattern: "^([0-9]{2})([A-Z]{1,2})$"
    bottom_pattern: "^([0-9]{5})$"
    output: "{top}-{bottom}"

  - name: "fallback"
    type: "fallback"
    output: "{raw}"